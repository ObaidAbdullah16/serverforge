# Ansible settings for this repository. Run every command from the repo root
# (the scripts in scripts/ do that for you).
[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
forks = 10
gathering = smart
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
# Show how long each task took at the end of a run (built into ansible-core).
callbacks_enabled = ansible.builtin.profile_tasks
nocows = True

[ssh_connection]
pipelining = True
# accept-new: trust a server's host key the first time we see it, then refuse
# connections if it ever changes (a changed key can mean someone is in the middle).
# The lab and AWS scripts delete this file when they create fresh servers.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.keys/known_hosts
