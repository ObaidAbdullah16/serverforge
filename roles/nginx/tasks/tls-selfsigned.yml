---
# A self-signed certificate: traffic is encrypted, but browsers warn because no
# public authority vouches for it. Fine for a lab or a server without a domain.
- name: Create a self-signed certificate (valid 1 year)
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 365
      -subj "/CN={{ inventory_hostname }}"
      -addext "subjectAltName=DNS:{{ inventory_hostname }},DNS:localhost,IP:127.0.0.1"
      -keyout {{ nginx_cert_dir }}/selfsigned.key
      -out {{ nginx_cert_dir }}/selfsigned.crt
    creates: "{{ nginx_cert_dir }}/selfsigned.crt"
  notify: Reload nginx

- name: Use the self-signed certificate
  ansible.builtin.set_fact:
    nginx_ssl_certificate: "{{ nginx_cert_dir }}/selfsigned.crt"
    nginx_ssl_certificate_key: "{{ nginx_cert_dir }}/selfsigned.key"
