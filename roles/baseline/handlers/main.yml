---
# try-reload-or-restart: reload sshd if it is running, do nothing if it is not
# (Ubuntu 24.04 starts sshd on demand through ssh.socket). Existing sessions,
# including the one Ansible is using right now, stay connected.
- name: Reload ssh
  # The systemd module has no "try-reload-or-restart", so systemctl is called directly.
  ansible.builtin.command: systemctl try-reload-or-restart ssh.service  # noqa: command-instead-of-module
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
