---
- name: Backup directory (root only)
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Backup and restore scripts
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop: [serverforge-backup, serverforge-restore]

- name: Install the systemd service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [serverforge-backup.service, serverforge-backup.timer]
  register: backup_units

- name: Enable the nightly timer
  ansible.builtin.systemd_service:
    name: serverforge-backup.timer
    enabled: true
    state: started
    daemon_reload: "{{ backup_units is changed }}"
