# Local lab: three "servers" (Ubuntu 24.04 + systemd + SSH) and, optionally,
# Jenkins with one build agent. Started by scripts/lab-up.sh - use that, it
# creates the SSH keys this file expects.
name: serverforge-lab

x-node: &node
  image: serverforge-node:local
  build:
    context: .
    dockerfile: node.Dockerfile
    args:
      LAB_PUBKEY: ${LAB_PUBKEY:?run scripts/lab-up.sh instead of docker compose directly}
  # systemd inside a container needs these. Lab only - never run app
  # containers privileged in production.
  privileged: true
  cgroup: host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  tmpfs:
    - /run
    - /run/lock
  networks: [lab]
  restart: "no"

services:
  web-stg-1:
    <<: *node
    hostname: web-stg-1
    ports: ["127.0.0.1:2221:22", "127.0.0.1:8441:443"]

  web-prod-1:
    <<: *node
    hostname: web-prod-1
    ports: ["127.0.0.1:2222:22", "127.0.0.1:8442:443"]

  web-prod-2:
    <<: *node
    hostname: web-prod-2
    ports: ["127.0.0.1:2223:22", "127.0.0.1:8443:443"]

  # ---- Jenkins (scripts/lab-up.sh --with-jenkins) --------------------------
  jenkins:
    profiles: [jenkins]
    image: serverforge-jenkins:local
    build:
      context: ../jenkins
      dockerfile: controller.Dockerfile
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?run scripts/lab-up.sh --with-jenkins}
      SERVERFORGE_REPO_URL: ${SERVERFORGE_REPO_URL:-https://github.com/ObaidAbdullah16/serverforge.git}
      SERVERFORGE_BRANCH: ${SERVERFORGE_BRANCH:-main}
    ports: ["127.0.0.1:8085:8080"]
    volumes:
      - jenkins_home:/var/jenkins_home
    secrets: [agent_key, lab_key]
    networks: [lab]
    depends_on: [jenkins-agent]

  jenkins-agent:
    profiles: [jenkins]
    image: serverforge-jenkins-agent:local
    build:
      context: ..
      dockerfile: jenkins/agent.Dockerfile
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${AGENT_PUBKEY:?run scripts/lab-up.sh --with-jenkins}
    networks: [lab]

secrets:
  agent_key:
    file: .secrets/agent_ed25519
  lab_key:
    file: .secrets/lab_ed25519

volumes:
  jenkins_home:

networks:
  lab:
