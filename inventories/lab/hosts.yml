# Local lab: three Ubuntu 24.04 containers with systemd + SSH (scripts/lab-up.sh).
# From your laptop Ansible reaches them on 127.0.0.1:<lab_port>; from the Jenkins
# agent (same Docker network) it uses the container name and port 22.
all:
  children:
    staging:
      hosts:
        web-stg-1:
          lab_port: 2221
    production:
      hosts:
        web-prod-1:
          lab_port: 2222
        web-prod-2:
          lab_port: 2223
